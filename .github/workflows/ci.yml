name: Check site

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Test, build and check generated site
        run: npm run check
        env:
          JEKYLL_ENV: production
      - name: Check deployment under a subpath
        run: |
          bundle exec jekyll build --baseurl /preview --destination _site-preview
          python3 scripts/check_site.py _site-preview --baseurl /preview
        env:
          JEKYLL_ENV: production
