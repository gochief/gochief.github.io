title:            gochief
description:      "Hi，我是 Gochief，是一个后端工程师，会一点 Go / Python，喜欢折腾各种新技术。"
description_en: "Hi, I'm Gochief, a backend engineer who works with Go and Python and enjoys exploring new technologies."

github: gochief


url: "https://gochief.github.io"
baseurl: ""
menu:
  - title: 'Categories'
    key: categories
    url: '/categories.html'
  - title: 'About'
    key: about
    url: '/about/'
  - title: 'Github'
    key: github
    url: 'https://github.com/gochief'
  - title: 'RSS'
    key: rss
    url: '/feed.xml'

timezone:    Asia/Shanghai
locale:      zh_CN
lang:      zh-CN
future:      false
highlighter: rouge
markdown:    kramdown
sass:
  sass_dir: _sass
  style: compressed

permalink:   /:year-:month-:day/:title.html
assetUrl: 
defaultImage: data:image/gif;base64,R0lGODlhAQABAAAAACH5BAEKAAEALAAAAAABAAEAAAICTAEAOw==



paginate: 10
paginate_path: "/page:num/"
post_ext: md
page_ext: md
post_layout: post
page_layout: page
titlecase: true

showBuyCoffee: true
coffee_url: ""

# Fill all four fields using https://giscus.app before enabling comments.
giscus:
  repo: ""
  repo_id: ""
  category: ""
  category_id: ""

include: [".htaccess"]
exclude:
  - Gemfile
  - Gemfile.lock
  - README.md
  - License
  - package.json
  - package-lock.json
  - node_modules
  - vendor
  - scripts
  - tests

plugins:
  - jekyll-paginate
  - jekyll-sitemap
  - jekyll-pdf-embed

defaults:
  - scope:
      path: "js/**"
    values:
      sitemap: false
